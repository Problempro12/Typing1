<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица лидеров</title>
    <link rel="stylesheet" href="/static/public.css"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #302b35;
        }
        .overflow-y-auto::-webkit-scrollbar {
            width: 8px;
        }
        
        .overflow-y-auto::-webkit-scrollbar-track {
            background: rgba(139, 92, 246, 0.1);
            border-radius: 4px;
        }
        
        .overflow-y-auto::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 4px;
        }
        
        .overflow-y-auto::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.5);
        }
    </style>
</head>
<body class="bg-[#302b35] text-white">
    <h1 class="text-3xl md:text-5xl bg-violet-700/20 py-3 text-violet-300 mb-4 text-center mx-2 rounded-b-2xl shadow-md shadow-violet-800/30">
        Таблица лидеров
    </h1>

    <div class="max-w-4xl mx-auto p-4">
        <!-- Фильтры и сортировка -->
        <div class="filters border-2 border-violet-900 rounded-lg p-4 mb-4">
            <div class="flex flex-wrap gap-4 justify-center">
                <div class="filter-group">
                    <label class="mr-2">Сложность:</label>
                    <select id="difficulty-filter" 
                            class="bg-zinc-800 border-2 border-violet-900 rounded px-2 py-1">
                        <option value="all">Все</option>
                        <option value="Легкий">Легкий</option>
                        <option value="Обычный">Обычный</option>
                        <option value="Продвинутый">Продвинутый</option>
                        <option value="Эксперт">Эксперт</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="mr-2">Сортировка:</label>
                    <select id="sort-by" 
                            class="bg-zinc-800 border-2 border-violet-900 rounded px-2 py-1">
                        <option value="wpm">По скорости</option>
                        <option value="accuracy">По точности</option>
                        <option value="date">По дате</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="high-scores border-2 border-violet-900 rounded-lg p-4">
            <div class="overflow-x-auto overflow-y-auto" style="max-height: 300px;">
                <table class="w-full">
                    <thead>
                        <tr class="border-b border-violet-800 sticky top-0 bg-[#302b35]">
                            <th class="p-2">Место</th>
                            <th class="p-2">Имя</th>
                            <th class="p-2">Скорость</th>
                            <th class="p-2">Точность</th>
                            <th class="p-2">Сложность</th>
                            <th class="p-2">Дата</th>
                        </tr>
                    </thead>
                    <tbody id="high-scores-table">
                        <!-- Здесь будут отображаться рекорды -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="text-center mt-8">
            <a href="/" class="bg-violet-900/50 hover:bg-violet-800/50 rounded-lg p-3 mt-3">
                На главную
            </a>
        </div>
    </div>

    <script>
    function getDifficultyClass(difficulty) {
        switch (difficulty) {
            case 'Эксперт':
                return 'bg-red-900/50 text-red-200';
            case 'Продвинутый':
                return 'bg-orange-900/50 text-orange-200';
            case 'Обычный':
                return 'bg-yellow-900/50 text-yellow-200';
            case 'Легкий':
                return 'bg-green-900/50 text-green-200';
            default:
                return 'bg-gray-900/50 text-gray-200';
        }
    }

    let currentScores = [];
    
    async function loadScores() {
        try {
            const response = await fetch('/api/scores');
            const scores = await response.json();
            currentScores = scores;
            if (!currentScores || currentScores.length === 0) {
                const tableBody = document.getElementById('high-scores-table');
                tableBody.innerHTML = `
                    <tr class="border-b border-violet-800/30">
                        <td colspan="6" class="p-4 text-center text-gray-400">
                            Пока нет результатов
                        </td>
                    </tr>
                `;
                return;
            }
            displayFilteredScores();
        } catch (error) {
            console.error('Ошибка загрузки результатов:', error);
            const tableBody = document.getElementById('high-scores-table');
            tableBody.innerHTML = `
                <tr class="border-b border-violet-800/30">
                    <td colspan="6" class="p-4 text-center text-red-400">
                        Ошибка загрузки результатов
                    </td>
                </tr>
            `;
        }
    }

    function displayFilteredScores() {
        const difficultyFilter = document.getElementById('difficulty-filter').value;
        const sortBy = document.getElementById('sort-by').value;
        
        let filteredScores = [...currentScores];
        
        if (difficultyFilter !== 'all') {
            filteredScores = filteredScores.filter(score => score.difficulty === difficultyFilter);
        }
        
        filteredScores.sort((a, b) => {
            switch (sortBy) {
                case 'wpm':
                    return parseInt(b.wpm) - parseInt(a.wpm);
                case 'accuracy':
                    return parseInt(b.accuracy) - parseInt(a.accuracy);
                case 'date':
                    return new Date(b.dateTime) - new Date(a.dateTime);
                default:
                    return 0;
            }
        });
        
        const tableBody = document.getElementById('high-scores-table');
        if (!filteredScores.length) {
            tableBody.innerHTML = `
                <tr class="border-b border-violet-800/30">
                    <td colspan="6" class="p-4 text-center text-gray-400">
                        Нет результатов для выбранного фильтра
                    </td>
                </tr>
            `;
            return;
        }
        
        tableBody.innerHTML = filteredScores.map((score, index) => `
            <tr class="border-b border-violet-800/30 ${index === 0 ? 'bg-violet-900/30' : ''}">
                <td class="p-2">${index + 1}</td>
                <td class="p-2">${score.name}</td>
                <td class="p-2">${score.wpm}</td>
                <td class="p-2">${score.accuracy}%</td>
                <td class="p-2">
                    <span class="px-2 py-1 rounded-full text-sm ${getDifficultyClass(score.difficulty)}">
                        ${score.difficulty}
                    </span>
                </td>
                <td class="p-2">${formatDateTime(score.dateTime)}</td>
            </tr>
        `).join('');
    }

    // Функция форматирования даты для отображения
    function formatDateTime(isoString) {
        try {
            const date = new Date(isoString);
            if (isNaN(date)) return isoString;
            
            const day = date.getDate().toString().padStart(2, '0');
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            const seconds = date.getSeconds().toString().padStart(2, '0');
            return `${day}/${month} ${hours}:${minutes}:${seconds}`;
        } catch (e) {
            return isoString;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadScores();
        // Добавляем обработчики событий для фильтров
        document.getElementById('difficulty-filter').addEventListener('change', displayFilteredScores);
        document.getElementById('sort-by').addEventListener('change', displayFilteredScores);
    });
    </script>
</body>
</html>
