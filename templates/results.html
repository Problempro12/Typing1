<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" /> -->
    <script src="{{ url_for('static', filename='words.js') }}"></script>
    <!-- Подключаем words.js -->
    <link rel="stylesheet" href="/static/public.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Результаты теста на скорость печати</title>
    <style>
        #devtools-banner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        background-color: rgba(0, 0, 0, 0.95);
            color: white;
            font-size: 2em;
            text-align: center;
            line-height: 100vh;
            z-index: 9999;
        font-family: 'Montserrat', sans-serif;
      }

      :root {
        --primary-color: #4f46e5;
        --primary-dark: #4338ca;
        --secondary-color: #8b5cf6;
        --accent-color: #f59e0b;
        --text-dark: #1e293b;
        --text-light: #f8fafc;
        --bg-light: #f8fafc;
        --bg-dark: #1e293b;
        --card-bg: #ffffff;
        --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        --border-radius: 16px;
        --transition: all 0.3s ease;
      }

      body {
        font-family: 'Montserrat', sans-serif;
        background: linear-gradient(135deg, var(--bg-light) 0%, #e2e8f0 100%);
        color: var(--text-dark);
        min-height: 100vh;
        margin: 0;
        padding: 0;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 50%, rgba(79, 70, 229, 0.1) 0%, rgba(139, 92, 246, 0.05) 50%, transparent 100%);
        z-index: -1;
        animation: pulse 15s infinite alternate;
      }

      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.5; }
        100% { transform: scale(1.1); opacity: 0.8; }
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .results-card {
        background: var(--card-bg);
        border-radius: var(--border-radius);
        box-shadow: var(--card-shadow);
        padding: 40px;
        margin-bottom: 40px;
        position: relative;
        overflow: hidden;
        transition: var(--transition);
      }

      .results-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
        background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
      }

      .results-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
      }

      .results-header {
        text-align: center;
        margin-bottom: 40px;
        position: relative;
      }

      .results-title {
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 15px;
        background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        position: relative;
        display: inline-block;
      }

      .results-title::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 4px;
        background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        border-radius: 2px;
      }

      .results-subtitle {
        font-size: 1.3rem;
        color: var(--text-dark);
        opacity: 0.8;
        margin-top: 20px;
      }

      .results-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }

      .stat-card {
        background: var(--bg-light);
        border-radius: 12px;
        padding: 25px 20px;
        text-align: center;
        transition: var(--transition);
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 150px;
        word-break: break-word;
        hyphens: auto;
      }

      .stat-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(79, 70, 229, 0.05) 0%, rgba(139, 92, 246, 0.05) 100%);
        opacity: 0;
        transition: var(--transition);
      }

      .stat-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      .stat-card:hover::before {
        opacity: 1;
      }

      .stat-icon {
        font-size: 1.5rem;
        color: var(--primary-color);
        margin-bottom: 10px;
        opacity: 0.8;
      }

      .stat-value {
        font-size: 2.2rem;
        font-weight: 700;
        color: var(--primary-color);
        margin-bottom: 10px;
        position: relative;
        display: inline-block;
        line-height: 1.2;
        word-break: break-word;
      }

      .stat-value::after {
        content: '';
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        width: 30px;
        height: 2px;
        background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        border-radius: 2px;
      }

      .stat-label {
        font-size: 1rem;
        color: var(--text-dark);
        font-weight: 500;
        opacity: 0.8;
        word-break: break-word;
        hyphens: auto;
        padding: 0 5px;
      }

      .save-form {
        background: var(--bg-light);
        border-radius: 12px;
        padding: 30px;
        margin-bottom: 30px;
        border: 1px solid rgba(0, 0, 0, 0.05);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        transition: all 0.3s ease;
      }

      .save-form.hidden {
      display: none;
    }
  
      .save-form h3 {
        font-size: 1.8rem;
        color: var(--text-dark);
        margin-bottom: 25px;
        text-align: center;
        position: relative;
        display: inline-block;
        left: 50%;
        transform: translateX(-50%);
      }

      .save-form h3::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        border-radius: 2px;
      }

      .input-group {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
      }

      .input-group input {
        flex: 1;
        padding: 15px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 1.1rem;
        transition: var(--transition);
        background: white;
      }

      .input-group input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
      }

      .save-btn {
        background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        color: white;
        border: none;
        border-radius: 8px;
        padding: 15px 30px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
      }

      .save-btn:hover {
        background: linear-gradient(90deg, var(--primary-dark), var(--secondary-color));
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(79, 70, 229, 0.4);
      }

      .save-btn:active {
        transform: translateY(0);
        box-shadow: 0 2px 5px rgba(79, 70, 229, 0.3);
      }

      .high-scores {
        background: var(--card-bg);
        border-radius: var(--border-radius);
        box-shadow: var(--card-shadow);
        padding: 40px;
        position: relative;
        overflow: hidden;
      }

      .high-scores::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
        background: linear-gradient(90deg, var(--secondary-color), var(--accent-color));
      }

      .high-scores h2 {
        font-size: 2.2rem;
        color: var(--text-dark);
        margin-bottom: 30px;
        text-align: center;
        position: relative;
        display: inline-block;
        left: 50%;
        transform: translateX(-50%);
      }

      .high-scores h2::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, var(--secondary-color), var(--accent-color));
        border-radius: 2px;
      }

      .filters {
        display: flex;
        justify-content: center;
        gap: 25px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }

      .filter-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .filter-group label {
        font-weight: 600;
        color: var(--text-dark);
      }

      .filter-group select {
        padding: 10px 15px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 1rem;
        background: white;
        color: var(--text-dark);
        cursor: pointer;
        transition: var(--transition);
        min-width: 150px;
      }

      .filter-group select:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
      }

      .table-container {
        overflow-x: auto;
        border-radius: 8px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      }

      .scores-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }

      .scores-table th {
        background: var(--bg-light);
        padding: 15px;
        text-align: left;
        font-weight: 600;
        color: var(--text-dark);
        border-bottom: 2px solid #e2e8f0;
      }

      .scores-table td {
        padding: 15px;
        border-bottom: 1px solid #e2e8f0;
        color: var(--text-dark);
      }

      .scores-table tr:hover {
        background: rgba(79, 70, 229, 0.05);
      }

      .scores-table tr:last-child td {
        border-bottom: none;
      }

      .home-btn {
        display: inline-block;
        background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        color: white;
        text-decoration: none;
        padding: 15px 30px;
        border-radius: 8px;
        font-weight: 600;
        transition: var(--transition);
        margin-top: 30px;
        box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
      }

      .home-btn:hover {
        background: linear-gradient(90deg, var(--primary-dark), var(--secondary-color));
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(79, 70, 229, 0.4);
      }

      .home-btn i {
        margin-right: 8px;
      }

      .text-center {
        text-align: center;
      }

      .mt-20 {
        margin-top: 20px;
      }

      .mb-20 {
        margin-bottom: 20px;
      }

      @media (max-width: 768px) {
        .results-stats {
          grid-template-columns: 1fr;
        }

        .filters {
          flex-direction: column;
          align-items: stretch;
        }

        .input-group {
          flex-direction: column;
        }

        .results-card, .high-scores {
          padding: 25px;
        }

        .results-title {
          font-size: 2.2rem;
        }
      }
    </style>
</head>
<body>
    <div id="devtools-banner">
        ❌ Открытие инструментов разработчика запрещено! ❌
      </div>
    <div class="container">
        <div class="results-card">
            <div class="results-header">
                <h1 class="results-title">Результаты теста</h1>
                <p class="results-subtitle">Проверьте свои достижения</p>
            </div>

            <div class="results-stats">
                <div class="stat-card">
                    <i class="fas fa-tachometer-alt stat-icon"></i>
                    <div class="stat-value" id="final-wpm">0</div>
                    <div class="stat-label">Скорость (CPM)</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-bullseye stat-icon"></i>
                    <div class="stat-value" id="final-accuracy">0</div>
                    <div class="stat-label">Точность (%)</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-layer-group stat-icon"></i>
                    <div class="stat-value" id="difficulty-level"></div>
                    <div class="stat-label">Сложность</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-clock stat-icon"></i>
                    <div class="stat-value" id="final-time"></div>
                    <div class="stat-label">Дата и время</div>
                </div>
            </div>

            <div class="save-form">
                <h3>Сохранить результат</h3>
                <div class="input-group">
                    <input type="text" id="studentName" placeholder="Введите имя студента" maxlength="20">
                    <button class="save-btn" onclick="saveScore()">
                        <i class="fas fa-save"></i> Сохранить
                    </button>
                </div>
            </div>
        </div>

        <div class="high-scores">
            <h2>Таблица рекордов</h2>
            <div class="filters">
                <div class="filter-group">
                    <label>Сложность:</label>
                    <select id="difficulty-filter">
                        <option value="all">Все</option>
                        <option value="Легкий">Легкий</option>
                        <option value="Нормальный">Нормальный</option>
                        <option value="Продвинутый">Продвинутый</option>
                        <option value="Экспертный">Экспертный</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Сортировка:</label>
                    <select id="sort-by">
                        <option value="wpm">По скорости</option>
                        <option value="accuracy">По точности</option>
                        <option value="date">По дате</option>
                    </select>
                </div>
            </div>

            <div class="table-container">
                <table class="scores-table">
                    <thead>
                        <tr>
                            <th>Место</th>
                            <th>Имя</th>
                            <th>Скорость</th>
                            <th>Точность</th>
                            <th>Сложность</th>
                            <th>Дата</th>
                        </tr>
                    </thead>
                    <tbody id="high-scores-table">
                        <!-- Здесь будут отображаться рекорды -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="text-center mt-20 mb-20">
            <a href="/" class="home-btn">
                <i class="fas fa-home"></i> Вернуться на главную
            </a>
        </div>
    </div>

<script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('data');

            if (encodedData) {
                const decodedData = decodeResults(encodedData);

                document.getElementById('final-wpm').textContent = decodedData.wpm;
                document.getElementById('final-accuracy').textContent = decodedData.accuracy;
                document.getElementById('difficulty-level').textContent = decodedData.difficulty;
                document.getElementById('final-time').textContent = formatDateTime(decodedData.dateTime);
                
                // Добавляем анимацию для значений
                animateValue('final-wpm', 0, decodedData.wpm, 1500);
                animateValue('final-accuracy', 0, decodedData.accuracy, 1500);
            }
            
            displayHighScores();
        });

        // Функция для анимации значений
        function animateValue(elementId, start, end, duration) {
            const element = document.getElementById(elementId);
            const range = end - start;
            const increment = range / (duration / 16);
            let current = start;
            
            const timer = setInterval(() => {
                current += increment;
                if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
                    clearInterval(timer);
                    current = end;
                }
                element.textContent = Math.round(current);
            }, 16);
        }

        // Функция для дешифрования данных
        function decodeResults(encodedData) {
            try {
                const data = JSON.parse(decodeURIComponent(encodedData));
                // Добавляем флаг saved, если его нет
                if (!data.hasOwnProperty('saved')) {
                    data.saved = false;
                }
                return data;
            } catch (e) {
                console.error('Ошибка декодирования:', e);
                return {
                    wpm: '0',
                    accuracy: '0',
                    difficulty: 'Обычный',
                    dateTime: 'Нет данных',
                    saved: false
                };
            }
        }

        async function saveScore() {
            const studentName = document.getElementById('studentName').value.trim();
            if (!studentName) {
                alert('Пожалуйста, введите имя студента');
                return;
            }

            const score = {
                wpm: parseFloat(document.getElementById('final-wpm').textContent),
                accuracy: parseFloat(document.getElementById('final-accuracy').textContent),
                difficulty: document.getElementById('difficulty-level').textContent,
                dateTime: document.getElementById('final-time').textContent,
                studentName: studentName
            };

            try {
                const response = await fetch('/api/save-score', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(score)
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Результат успешно сохранен');
                    window.location.href = '/';
                } else {
                    if (response.status === 401) {
                        window.location.href = '/login';
                    } else {
                        alert(data.message || 'Ошибка при сохранении результата');
                    }
                }
            } catch (error) {
                console.error('Ошибка при сохранении результата:', error);
                alert('Произошла ошибка при сохранении результата');
            }
        }

        let currentScores = [];
        
        function displayHighScores() {
            fetch('/api/scores')
                .then(response => response.json())
                .then(scores => {
                    // Фильтруем только сохраненные результаты
                    currentScores = scores.filter(score => score.saved === true);
                    displayFilteredScores();
                })
                .catch(error => {
                    console.error('Ошибка загрузки результатов:', error);
                    const tableBody = document.getElementById('high-scores-table');
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="6" style="text-align: center; color: red; padding: 20px;">
                                Ошибка загрузки результатов
                            </td>
                        </tr>
                    `;
                });
        }

        function getDifficultyClass(difficulty) {
            switch (difficulty) {
                case 'Экспертный':
                    return 'bg-[rgba(239,68,68,0.1)] text-[#ef4444]';
                case 'Продвинутый':
                    return 'bg-[rgba(138,43,226,0.1)] text-[#8a2be2]';
                case 'Нормальный':
                    return 'bg-[rgba(99,102,241,0.1)] text-[#6366f1]';
                case 'Начальный':
                    return 'bg-[rgba(16,185,129,0.1)] text-[#10b981]';
                default:
                    return 'bg-gray-100 text-gray-800';
            }
        }
        
        function displayFilteredScores() {
            const difficultyFilter = document.getElementById('difficulty-filter').value;
            const sortBy = document.getElementById('sort-by').value;
            
            let filteredScores = [...currentScores];
            
            if (difficultyFilter !== 'all') {
                filteredScores = filteredScores.filter(score => score.difficulty === difficultyFilter);
            }
            
            filteredScores.sort((a, b) => {
                switch (sortBy) {
                    case 'wpm':
                        return parseInt(b.wpm) - parseInt(a.wpm);
                    case 'accuracy':
                        return parseInt(b.accuracy) - parseInt(a.accuracy);
                    case 'date':
                        const dateA = new Date(a.dateTime);
                        const dateB = new Date(b.dateTime);
                        return dateB.getTime() - dateA.getTime();
                    default:
                        return 0;
                }
            });
            
            const tableBody = document.getElementById('high-scores-table');
            if (!filteredScores.length) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 20px; color: #64748b;">
                            Нет результатов для выбранного фильтра
                        </td>
                    </tr>
                `;
                return;
            }
            
            tableBody.innerHTML = filteredScores.map((score, index) => {
                let medalClass = '';
                if (index === 0) medalClass = 'bg-[rgba(255,223,0,0.1)]';
                else if (index === 1) medalClass = 'bg-[rgba(192,192,192,0.1)]';
                else if (index === 2) medalClass = 'bg-[rgba(205,127,50,0.1)]';
                
                return `
                    <tr class="${medalClass}">
                        <td>
                            ${index === 0 ? '<i class="fas fa-medal" style="color: #FFD700;"></i>' : 
                              index === 1 ? '<i class="fas fa-medal" style="color: #C0C0C0;"></i>' : 
                              index === 2 ? '<i class="fas fa-medal" style="color: #CD7F32;"></i>' : 
                              index + 1}
                        </td>
                        <td>${score.studentName || 'Аноним'}</td>
                        <td>${score.wpm}</td>
                        <td>${score.accuracy}%</td>
                        <td>
                            <span class="px-2 py-1 rounded-full text-sm ${getDifficultyClass(score.difficulty)}">
                                ${score.difficulty}
                            </span>
                        </td>
                        <td>${formatDateTime(score.dateTime)}</td>
                    </tr>
                `;
            }).join('');
        }

        // Функция форматирования даты для отображения
        function formatDateTime(isoString) {
            try {
                const date = new Date(isoString);
                if (isNaN(date)) return isoString;
                
                const day = date.getDate().toString().padStart(2, '0');
                const month = (date.getMonth() + 1).toString().padStart(2, '0');
                const hours = date.getHours().toString().padStart(2, '0');
                const minutes = date.getMinutes().toString().padStart(2, '0');
                return `${day}/${month} ${hours}:${minutes}`;
            } catch (e) {
                return isoString;
            }
        }

        // Добавляем обработчики событий для фильтров после загрузки DOM
        document.getElementById('difficulty-filter').addEventListener('change', displayFilteredScores);
        document.getElementById('sort-by').addEventListener('change', displayFilteredScores);

        document.addEventListener('keydown', function (event) {
            if (event.key === 'F12' || (event.ctrlKey && event.shiftKey && event.key === 'I')) {
                event.preventDefault();
                document.getElementById('devtools-banner').style.display = 'block';
            }
        });

        document.ondragstart = noselect;
        document.onselectstart = noselect;
        document.oncontextmenu = noselect;
